services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sportchain
      POSTGRES_PASSWORD: sportchain
      POSTGRES_DB: sportchain
    ports: ["0.0.0.0:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportchain"]
      interval: 3s
      timeout: 3s
      retries: 20
  chain:
    build:
      context: .
      dockerfile: Dockerfile.chain
    ports: ["0.0.0.0:8545:8545"]
    volumes: ["./.runtime:/app/.runtime"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  seed:
    build:
      context: .
      dockerfile: Dockerfile.chain
    command: ["npm", "run", "seed"]
    environment:
      RPC_URL: http://chain:8545
    volumes: ["./.runtime:/app/.runtime"]
    depends_on:
      chain:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sportchain:sportchain@postgres:5432/sportchain
      RPC_URL: http://chain:8545
      DEPLOYMENT_FILE: /app/.runtime/deployment.json
      STORAGE_DIR: /app/backend/data/files
    ports: ["0.0.0.0:8000:8000"]
    volumes: ["./.runtime:/app/.runtime:ro", "evidence-data:/app/backend/data"]
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_URL: http://backend:8000
    ports: ["0.0.0.0:5173:5173"]
    depends_on: [backend]
volumes:
  postgres-data:
  evidence-data:
